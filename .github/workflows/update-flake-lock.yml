name: Update flake.lock

on:
  schedule:
    # Mondays at 03:30 Beijing time; off the package workflow's minute so the
    # two never race on the same push.
    - cron: "30 19 * * 1"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update nixpkgs
        run: nix flake update --accept-flake-config

      - name: Build
        run: nix build .#magpie --accept-flake-config -L

      - name: Commit and push
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "chore: update flake.lock"
            git pull --rebase origin main
            git push origin main
          fi
