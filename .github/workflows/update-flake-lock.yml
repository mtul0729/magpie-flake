name: Update flake.lock

on:
  schedule:
    # Daily at 02:43 UTC: GitHub-hosted-runner off-peak (US deep night, EU
    # pre-dawn).  The previous 19:30 UTC slot sat in the US-afternoon peak,
    # and on 2026-10-05 the job burned its whole 15-minute acquisition budget
    # without ever getting a runner.  Minute 43 stays off the package
    # workflow's :17 (so the two never race on the same push) and off the
    # :00/:30 minutes where scheduled jobs pile up.
    - cron: "43 2 * * *"
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update nixpkgs
        run: nix flake update --accept-flake-config

      - name: Build
        run: nix build .#magpie --accept-flake-config -L

      - name: Commit and push
        run: |
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add flake.lock
            git commit -m "chore: update flake.lock"
            git pull --rebase origin main
            git push origin main
          fi
